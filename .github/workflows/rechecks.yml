name: Reconsultas processuais
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: process-rechecks
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Executar reconsultas vencidas
        env:
          APP_URL: https://plataforma-kyc1.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request, time
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=https%3A%2F%2Fplataforma-kyc1.onrender.com'
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)['value']
          for attempt in range(5):
              req = urllib.request.Request(os.environ['APP_URL']+'/api/automation/run-due', data=b'{}', headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  result = json.load(response)
              print('Reconsultas registradas:', result['processed'])
              if result['processed'] == 0:
                  break
          PY
